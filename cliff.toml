# git-cliff configuration: https://git-cliff.org/docs/configuration

[bump]
initial_tag = "0.1.0"
features_always_bump_minor = true
breaking_always_bump_major = true

[changelog]
header = """
# Gesttalt changelog
"""
body = """
## What's changed
<!-- RELEASE NOTES START -->
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim }}
{%- endfor %}
{% endfor %}

{% if version and previous.version %}
**Full changelog**: https://github.com/pepicrft/gesttalt/compare/{{ previous.version }}...{{ version }}
{% endif %}
"""
trim = true
footer = """
<!-- generated by git-cliff -->
"""
postprocessors = [
  { pattern = '(feat|fix|perf|refactor)(\([^)]*\))?:\s*', replace = "" },
]

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Improvements" },
  { message = "^(build|chore|ci|docs|style|test)", skip = true },
]
protect_breaking_commits = true
filter_commits = true
tag_pattern = "v[0-9].*"
skip_tags = "beta|alpha"
ignore_tags = "rc"
topo_order = false
sort_commits = "newest"
