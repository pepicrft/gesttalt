name: Release

on:
  workflow_run:
    workflows:
      - Gesttalt
    branches: [main]
    types:
      - completed

permissions:
  contents: write
  packages: write

concurrency:
  group: gesttalt-release
  cancel-in-progress: false

jobs:
  check:
    name: Check for releasable changes
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: hetzner-docker
    outputs:
      should-release: ${{ steps.check.outputs.should-release }}
      next-version: ${{ steps.check.outputs.next-version }}
      next-version-number: ${{ steps.check.outputs.next-version-number }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: jdx/mise-action@v4
        with:
          install_args: git-cliff
      - id: check
        run: mise run release:check

  release:
    name: Release Gesttalt
    needs: check
    if: needs.check.outputs.should-release == 'true'
    runs-on: hetzner-docker
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: jdx/mise-action@v4
        with:
          install_args: "git-cliff helm"

      - name: Generate release notes
        id: release-notes
        env:
          NEXT_VERSION: ${{ needs.check.outputs.next-version }}
        run: |
          latest_version=$(git tag --list 'v[0-9]*' | sort -V | tail -n1)
          echo 'notes<<EOF' >> "$GITHUB_OUTPUT"
          if [ -n "$latest_version" ]; then
            git cliff --config cliff.toml --repository . --tag "$NEXT_VERSION" -- "$latest_version..HEAD" 2>/dev/null | sed -n '/<!-- RELEASE NOTES START -->/,/<!-- generated by git-cliff -->/p' | tail -n +2 | sed '$d' >> "$GITHUB_OUTPUT"
          else
            git cliff --config cliff.toml --repository . --tag "$NEXT_VERSION" 2>/dev/null | sed -n '/<!-- RELEASE NOTES START -->/,/<!-- generated by git-cliff -->/p' | tail -n +2 | sed '$d' >> "$GITHUB_OUTPUT"
          fi
          echo 'EOF' >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Build and publish container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.source=https://github.com/pepicrft/gesttalt
            org.opencontainers.image.version=${{ needs.check.outputs.next-version-number }}
          tags: |
            ghcr.io/pepicrft/gesttalt:${{ needs.check.outputs.next-version-number }}
            ghcr.io/pepicrft/gesttalt:latest
            ghcr.io/pepicrft/gesttalt:main

      - name: Package Helm chart
        env:
          VERSION: ${{ needs.check.outputs.next-version-number }}
        run: helm package deploy/helm/gesttalt --version "$VERSION" --app-version "$VERSION" --destination dist
      - name: Publish Helm chart
        env:
          VERSION: ${{ needs.check.outputs.next-version-number }}
          REGISTRY_TOKEN: ${{ secrets.GHCR_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm push "dist/gesttalt-${VERSION}.tgz" oci://ghcr.io/pepicrft/charts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          name: Gesttalt ${{ needs.check.outputs.next-version-number }}
          tag_name: ${{ needs.check.outputs.next-version }}
          body: |
            Container image: `ghcr.io/pepicrft/gesttalt:${{ needs.check.outputs.next-version-number }}`

            Helm chart: `oci://ghcr.io/pepicrft/charts/gesttalt`

            ${{ steps.release-notes.outputs.notes }}
          files: dist/gesttalt-${{ needs.check.outputs.next-version-number }}.tgz
