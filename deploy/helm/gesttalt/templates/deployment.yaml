apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gesttalt.fullname" . }}
  annotations:
    hermes.pepicrft.com/elixir-container: web
    hermes.pepicrft.com/elixir-release: {{ .Chart.Name | quote }}
  labels:
    {{- include "gesttalt.labels" . | nindent 4 }}
    hermes.pepicrft.com/production-elixir-console: enabled
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "gesttalt.selectorLabels" . | nindent 6 }}
      {{- if eq .Values.postgres.mode "standalone" }}
      app.kubernetes.io/component: web
      {{- end }}
  template:
    metadata:
      annotations:
        checksum/caddy: {{ include (print $.Template.BasePath "/caddy-config.yaml") . | sha256sum }}
      labels:
        {{- include "gesttalt.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- if .Values.postgres.tls.enabled }}
        # Preserve the image's public certificate authorities while adding the
        # private authority used by the in-cluster PostgreSQL service. This also
        # keeps images built before the explicit Repo option compatible.
        - name: prepare-database-trust
          image: {{ include "gesttalt.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - cp /etc/ssl/certs/ca-certificates.crt /combined/ca-certificates.crt && cat /database-certificate-authority/ca.crt >> /combined/ca-certificates.crt
          resources:
            {{- toYaml .Values.postgres.trustBundleResources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - name: database-certificate-authority
              mountPath: /database-certificate-authority
              readOnly: true
            - name: database-trust
              mountPath: /combined
        {{- end }}
        {{- if .Values.migrationJob.runAsInitContainer }}
        - name: wait-for-postgres
          image: {{ .Values.postgres.waitImage | quote }}
          command:
            - sh
            - -ec
            - until pg_isready --host "$PGHOST" --username "$PGUSER" --dbname "$PGDATABASE"; do sleep 2; done
          env:
            - name: PGHOST
              value: {{ include "gesttalt.postgresHost" . | quote }}
            - name: PGUSER
              value: {{ .Values.postgres.user | quote }}
            - name: PGDATABASE
              value: {{ .Values.postgres.database | quote }}
          resources:
            {{- toYaml .Values.migrationJob.waitResources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
        - name: migrate
          image: {{ include "gesttalt.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [/app/bin/gesttalt, eval, Gesttalt.Release.migrate_and_seed]
          env:
            - name: GESTTALT_DATABASE_SSL
              value: {{ .Values.postgres.tls.enabled | quote }}
            {{- if .Values.postgres.tls.enabled }}
            - name: GESTTALT_DATABASE_CERTIFICATE_AUTHORITY_FILE
              value: /etc/database-certificate-authority/ca.crt
            {{- end }}
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.envSecretName }}
            {{- if .Values.media.objectStorage.enabled }}
            - secretRef:
                name: {{ .Values.media.objectStorage.secretName }}
            {{- end }}
          resources:
            {{- toYaml .Values.migrationJob.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
          volumeMounts:
            {{- if or .Values.media.persistence.enabled (not .Values.media.objectStorage.enabled) }}
            - name: media
              mountPath: /app/uploads
            {{- end }}
            {{- if .Values.postgres.tls.enabled }}
            - name: database-certificate-authority
              mountPath: /etc/database-certificate-authority
              readOnly: true
            - name: database-trust
              mountPath: /etc/ssl/certs/ca-certificates.crt
              subPath: ca-certificates.crt
              readOnly: true
            {{- end }}
        {{- end }}
        # The upstream image grants the Caddy executable permission to bind low
        # ports. Copying it without that file capability lets the non-root
        # container execute it under the no-privilege-escalation policy. The
        # application only listens on the unprivileged ports below.
        - name: prepare-caddy-binary
          image: {{ .Values.caddy.image | quote }}
          command:
            - /bin/sh
            - -ec
            - cp /usr/bin/caddy /caddy-bin/caddy && chmod 0555 /caddy-bin/caddy
          resources:
            {{- toYaml .Values.caddy.permissionsResources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - name: caddy-bin
              mountPath: /caddy-bin
        {{- if .Values.caddy.persistence.enabled }}
        - name: migrate-caddy-data-ownership
          image: {{ .Values.caddy.permissionsImage | quote }}
          command:
            - chown
            - -R
            - "65534:65534"
            - /data
          resources:
            {{- toYaml .Values.caddy.permissionsResources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                # Existing Caddy directories can be private to their previous
                # owner, so the migration needs the capability below to
                # traverse them.
                - DAC_OVERRIDE
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - name: caddy-data
              mountPath: /data
        {{- end }}
      containers:
        - name: web
          image: {{ include "gesttalt.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: phoenix
              containerPort: 4000
          env:
            - name: ERL_CRASH_DUMP
              value: /tmp/erl_crash.dump
            - name: GESTTALT_DATABASE_SSL
              value: {{ .Values.postgres.tls.enabled | quote }}
            {{- if .Values.postgres.tls.enabled }}
            - name: GESTTALT_DATABASE_CERTIFICATE_AUTHORITY_FILE
              value: /etc/database-certificate-authority/ca.crt
            {{- end }}
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.envSecretName }}
            {{- if .Values.analytics.enabled }}
            - secretRef:
                name: {{ required "analytics.secretName is required when analytics is enabled" .Values.analytics.secretName }}
            {{- end }}
            {{- if .Values.media.objectStorage.enabled }}
            - secretRef:
                name: {{ .Values.media.objectStorage.secretName }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: phoenix
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: phoenix
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
          volumeMounts:
            {{- if or .Values.media.persistence.enabled (not .Values.media.objectStorage.enabled) }}
            - name: media
              mountPath: /app/uploads
            {{- end }}
            - name: tmp
              mountPath: /tmp
            {{- if .Values.postgres.tls.enabled }}
            - name: database-certificate-authority
              mountPath: /etc/database-certificate-authority
              readOnly: true
            - name: database-trust
              mountPath: /etc/ssl/certs/ca-certificates.crt
              subPath: ca-certificates.crt
              readOnly: true
            {{- end }}
        - name: caddy
          image: {{ .Values.caddy.image | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - /caddy-bin/caddy
            - run
            - --config
            - /etc/caddy/Caddyfile
            - --adapter
            - caddyfile
          ports:
            - name: http
              containerPort: {{ .Values.caddy.httpPort }}
            {{- if .Values.caddy.tls.enabled }}
            - name: https
              containerPort: {{ .Values.caddy.httpsPort }}
            {{- end }}
          env:
            - name: XDG_CONFIG_HOME
              value: /data/config
          readinessProbe:
            tcpSocket:
              {{- if .Values.caddy.tls.enabled }}
              port: https
              {{- else }}
              port: http
              {{- end }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
          volumeMounts:
            - name: caddy-config
              mountPath: /etc/caddy
              readOnly: true
            - name: caddy-data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: caddy-bin
              mountPath: /caddy-bin
              readOnly: true
      volumes:
        {{- if or .Values.media.persistence.enabled (not .Values.media.objectStorage.enabled) }}
        - name: media
          {{- if .Values.media.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "gesttalt.fullname" . }}-media
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- end }}
        - name: caddy-data
          {{- if .Values.caddy.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "gesttalt.fullname" . }}-caddy
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: caddy-config
          configMap:
            name: {{ include "gesttalt.fullname" . }}-caddy
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.temporaryFiles.sizeLimit }}
        - name: caddy-bin
          emptyDir:
            sizeLimit: 64Mi
        {{- if .Values.postgres.tls.enabled }}
        - name: database-certificate-authority
          secret:
            secretName: {{ default (printf "%s-ca" .Values.postgres.clusterName) .Values.postgres.certificateAuthoritySecretName }}
            defaultMode: 0444
            items:
              - key: ca.crt
                path: ca.crt
        - name: database-trust
          emptyDir:
            sizeLimit: 8Mi
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
