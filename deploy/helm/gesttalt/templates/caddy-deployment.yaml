apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gesttalt.fullname" . }}-caddy
  labels:
    {{- include "gesttalt.labels" . | nindent 4 }}
    app.kubernetes.io/component: caddy
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "gesttalt.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: caddy
  template:
    metadata:
      annotations:
        checksum/caddy: {{ include (print $.Template.BasePath "/caddy-config.yaml") . | sha256sum }}
      labels:
        {{- include "gesttalt.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: caddy
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: prepare-caddy-binary
          image: {{ .Values.caddy.image | quote }}
          command:
            - /bin/sh
            - -ec
            - cp /usr/bin/caddy /caddy-bin/caddy && chmod 0555 /caddy-bin/caddy
          resources:
            {{- toYaml .Values.caddy.permissionsResources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - name: caddy-bin
              mountPath: /caddy-bin
        {{- if .Values.caddy.persistence.enabled }}
        - name: migrate-caddy-data-ownership
          image: {{ .Values.caddy.permissionsImage | quote }}
          command:
            - chown
            - -R
            - "65534:65534"
            - /data
          resources:
            {{- toYaml .Values.caddy.permissionsResources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - name: caddy-data
              mountPath: /data
        {{- end }}
      containers:
        - name: caddy
          image: {{ .Values.caddy.image | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - /caddy-bin/caddy
            - run
            - --config
            - /etc/caddy/Caddyfile
            - --adapter
            - caddyfile
          ports:
            - name: http
              containerPort: {{ .Values.caddy.httpPort }}
            {{- if .Values.caddy.tls.enabled }}
            - name: https
              containerPort: {{ .Values.caddy.httpsPort }}
            {{- end }}
          env:
            - name: XDG_CONFIG_HOME
              value: /data/config
          readinessProbe:
            tcpSocket:
              {{- if .Values.caddy.tls.enabled }}
              port: https
              {{- else }}
              port: http
              {{- end }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
          volumeMounts:
            - name: caddy-config
              mountPath: /etc/caddy
              readOnly: true
            - name: caddy-data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: caddy-bin
              mountPath: /caddy-bin
              readOnly: true
      volumes:
        - name: caddy-data
          {{- if .Values.caddy.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "gesttalt.fullname" . }}-caddy
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: caddy-config
          configMap:
            name: {{ include "gesttalt.fullname" . }}-caddy
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.temporaryFiles.sizeLimit }}
        - name: caddy-bin
          emptyDir:
            sizeLimit: 64Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
