apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "gesttalt.fullname" . }}-migrate
  labels:
    {{- include "gesttalt.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrationJob.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.migrationJob.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "gesttalt.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: OnFailure
      securityContext:
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: prepare-database-trust
          image: {{ include "gesttalt.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - cp /etc/ssl/certs/ca-certificates.crt /combined/ca-certificates.crt && cat /database-certificate-authority/ca.crt >> /combined/ca-certificates.crt
          resources:
            {{- toYaml .Values.postgres.trustBundleResources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - name: database-certificate-authority
              mountPath: /database-certificate-authority
              readOnly: true
            - name: database-trust
              mountPath: /combined
        - name: wait-for-postgres
          image: {{ .Values.postgres.waitImage | quote }}
          command:
            - sh
            - -ec
            - until pg_isready --host "$PGHOST" --username "$PGUSER" --dbname "$PGDATABASE"; do sleep 2; done
          env:
            - name: PGHOST
              value: {{ include "gesttalt.postgresHost" . | quote }}
            - name: PGUSER
              value: {{ .Values.postgres.user | quote }}
            - name: PGDATABASE
              value: {{ .Values.postgres.database | quote }}
          resources:
            {{- toYaml .Values.migrationJob.waitResources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: migrate
          image: {{ include "gesttalt.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [/app/bin/gesttalt, eval, Gesttalt.Release.migrate_and_seed]
          env:
            - name: GESTTALT_DATABASE_CERTIFICATE_AUTHORITY_FILE
              value: /etc/database-certificate-authority/ca.crt
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.envSecretName }}
            {{- if .Values.media.objectStorage.enabled }}
            - secretRef:
                name: {{ .Values.media.objectStorage.secretName }}
            {{- end }}
          resources:
            {{- toYaml .Values.migrationJob.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
          volumeMounts:
            {{- if .Values.media.persistence.enabled }}
            - name: media
              mountPath: /app/uploads
            {{- end }}
            - name: database-certificate-authority
              mountPath: /etc/database-certificate-authority
              readOnly: true
            - name: database-trust
              mountPath: /etc/ssl/certs/ca-certificates.crt
              subPath: ca-certificates.crt
              readOnly: true
      volumes:
        {{- if .Values.media.persistence.enabled }}
        - name: media
          persistentVolumeClaim:
            claimName: {{ include "gesttalt.fullname" . }}-media
        {{- end }}
        - name: database-certificate-authority
          secret:
            secretName: {{ default (printf "%s-ca" .Values.postgres.clusterName) .Values.postgres.certificateAuthoritySecretName }}
            defaultMode: 0444
            items:
              - key: ca.crt
                path: ca.crt
        - name: database-trust
          emptyDir:
            sizeLimit: 8Mi
