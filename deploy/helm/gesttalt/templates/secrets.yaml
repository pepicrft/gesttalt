{{- if and .Values.secrets.create (not .Values.externalSecrets.enabled) }}
{{- $existingAppSecret := lookup "v1" "Secret" .Release.Namespace .Values.secrets.envSecretName | default dict }}
{{- $existingPostgresSecret := lookup "v1" "Secret" .Release.Namespace .Values.postgres.appSecretName | default dict }}
{{- $existingSecretKeyBase := dig "data" "GESTTALT_SECRET_KEY_BASE" "" $existingAppSecret | b64dec }}
{{- $existingPostgresPassword := dig "data" "password" "" $existingPostgresSecret | b64dec }}
{{- $secretKeyBase := coalesce .Values.secrets.secretKeyBase $existingSecretKeyBase (randAlphaNum 64) }}
{{- $postgresPassword := coalesce .Values.postgres.password $existingPostgresPassword (randAlphaNum 32) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.envSecretName }}
  labels:
    {{- include "gesttalt.labels" . | nindent 4 }}
type: Opaque
stringData:
  GESTTALT_DATABASE_URL: {{ printf "ecto://%s:%s@%s/%s" .Values.postgres.user ($postgresPassword | urlquery) (include "gesttalt.postgresHost" .) .Values.postgres.database | quote }}
  GESTTALT_SECRET_KEY_BASE: {{ $secretKeyBase | quote }}
  GESTTALT_TURNSTILE_SITE_KEY: {{ .Values.secrets.turnstileSiteKey | quote }}
  GESTTALT_TURNSTILE_SECRET_KEY: {{ .Values.secrets.turnstileSecretKey | quote }}
  {{- with .Values.secrets.agentAuthPrivateKey }}
  GESTTALT_AGENT_AUTH_PRIVATE_KEY_PEM: {{ . | quote }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.postgres.appSecretName }}
  labels:
    {{- include "gesttalt.labels" . | nindent 4 }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ .Values.postgres.user | quote }}
  password: {{ $postgresPassword | quote }}
{{- end }}
