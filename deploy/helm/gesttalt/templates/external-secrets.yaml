{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.envSecretName }}
  labels:
    {{- include "gesttalt.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    {{- toYaml .Values.externalSecrets.secretStoreRef | nindent 4 }}
  target:
    name: {{ .Values.secrets.envSecretName }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        GESTTALT_DATABASE_URL: {{ printf "ecto://%s:{{ .%s | urlquery }}@%s/%s" .Values.postgres.user .Values.externalSecrets.postgres.passwordField (include "gesttalt.postgresHost" .) .Values.postgres.database | quote }}
        {{- range $key, $remoteKey := .Values.externalSecrets.appEnv.fields }}
        {{ $key }}: {{ printf "{{ .%s }}" $remoteKey | quote }}
        {{- end }}
  data:
    - secretKey: {{ .Values.externalSecrets.postgres.passwordField | quote }}
      remoteRef:
        key: {{ printf "%s/%s" .Values.externalSecrets.postgres.itemKey .Values.externalSecrets.postgres.passwordField | quote }}
    {{- range $key, $remoteKey := .Values.externalSecrets.appEnv.fields }}
    - secretKey: {{ $remoteKey | quote }}
      remoteRef:
        key: {{ printf "%s/%s" $.Values.externalSecrets.appEnv.itemKey $remoteKey | quote }}
    {{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.postgres.appSecretName }}
  labels:
    {{- include "gesttalt.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    {{- toYaml .Values.externalSecrets.secretStoreRef | nindent 4 }}
  target:
    name: {{ .Values.postgres.appSecretName }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/basic-auth
      data:
        username: {{ .Values.postgres.user | quote }}
        password: {{ printf "{{ .%s }}" .Values.externalSecrets.postgres.passwordField | quote }}
  data:
    - secretKey: {{ .Values.externalSecrets.postgres.passwordField | quote }}
      remoteRef:
        key: {{ printf "%s/%s" .Values.externalSecrets.postgres.itemKey .Values.externalSecrets.postgres.passwordField | quote }}
{{- if .Values.externalSecrets.imagePullSecret.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecrets.imagePullSecret.name }}
  labels:
    {{- include "gesttalt.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    {{- toYaml .Values.externalSecrets.secretStoreRef | nindent 4 }}
  target:
    name: {{ .Values.externalSecrets.imagePullSecret.name }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: {{ printf "{\"auths\":{\"%s\":{\"username\":\"{{ .%s }}\",\"password\":\"{{ .%s }}\",\"auth\":\"{{ printf \\\"%%s:%%s\\\" .%s .%s | b64enc }}\"}}}" .Values.externalSecrets.imagePullSecret.registry .Values.externalSecrets.imagePullSecret.usernameField .Values.externalSecrets.imagePullSecret.passwordField .Values.externalSecrets.imagePullSecret.usernameField .Values.externalSecrets.imagePullSecret.passwordField | quote }}
  data:
    - secretKey: {{ .Values.externalSecrets.imagePullSecret.usernameField | quote }}
      remoteRef:
        key: {{ printf "%s/%s" .Values.externalSecrets.imagePullSecret.itemKey .Values.externalSecrets.imagePullSecret.usernameField | quote }}
    - secretKey: {{ .Values.externalSecrets.imagePullSecret.passwordField | quote }}
      remoteRef:
        key: {{ printf "%s/%s" .Values.externalSecrets.imagePullSecret.itemKey .Values.externalSecrets.imagePullSecret.passwordField | quote }}
{{- end }}
{{- end }}
