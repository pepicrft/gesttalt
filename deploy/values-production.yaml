fullnameOverride: gesttalt

env:
  GESTTALT_AGENT_AUTH_ALLOW_EPHEMERAL_KEY: "false"
  GESTTALT_MEDIA_STORAGE: s3
  GESTTALT_OG_BROWSER_POOL_SIZE: "2"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://observability-alloy.observability.svc.cluster.local:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_RESOURCE_ATTRIBUTES: service.namespace=gesttalt,deployment.environment.name=production,k8s.namespace.name=gesttalt
  OTEL_SERVICE_NAME: gesttalt

imagePullSecrets:
  - name: ghcr-pull-secret

analytics:
  enabled: true

service:
  type: LoadBalancer
  externalTrafficPolicy: Local
  annotations:
    external-dns.alpha.kubernetes.io/hostname: "gesttalt.org,*.gesttalt.org"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
    load-balancer.hetzner.cloud/location: fsn1
    load-balancer.hetzner.cloud/uses-proxyprotocol: "false"

caddy:
  tls:
    enabled: true
  trustedProxies:
    - 173.245.48.0/20
    - 103.21.244.0/22
    - 103.22.200.0/22
    - 103.31.4.0/22
    - 141.101.64.0/18
    - 108.162.192.0/18
    - 190.93.240.0/20
    - 188.114.96.0/20
    - 197.234.240.0/22
    - 198.41.128.0/17
    - 162.158.0.0/15
    - 104.16.0.0/13
    - 104.24.0.0/14
    - 172.64.0.0/13
    - 131.0.72.0/22
    - 2400:cb00::/32
    - 2606:4700::/32
    - 2803:f800::/32
    - 2405:b500::/32
    - 2405:8100::/32
    - 2a06:98c0::/29
    - 2c0f:f248::/32
  persistence:
    enabled: true
    storageClass: hcloud-volumes

media:
  objectStorage:
    enabled: true
    bucketName: pepicrft-gesttalt-media
  persistence:
    enabled: false
    storageClass: hcloud-volumes
    size: 50Gi

nodeSelector:
  node.cluster.x-k8s.io/pool: app

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1

postgres:
  mode: cloudnative
  tls:
    enabled: true
  storage:
    storageClass: hcloud-volumes
    size: 50Gi
  nodeSelector:
    node.cluster.x-k8s.io/pool: stateful
  tolerations:
    - key: node.cluster.x-k8s.io/pool
      operator: Equal
      value: stateful
      effect: NoSchedule
  backup:
    enabled: true
    endpointURL: https://fsn1.your-objectstorage.com
    bucketName: pepicrft-gesttalt-postgres-backups

migrationJob:
  runAsInitContainer: false

externalSecrets:
  enabled: true
  secretStoreRef:
    kind: ClusterSecretStore
    # Legacy store alias for the Pepicrft cluster, not a Salibu-owned cluster.
    name: salibu-production
  appEnv:
    itemKey: gesttalt
    fields:
      GESTTALT_SECRET_KEY_BASE: SECRET_KEY_BASE
      GESTTALT_AGENT_AUTH_PRIVATE_KEY_PEM: AGENT_AUTH_PRIVATE_KEY_PEM
      GESTTALT_TURNSTILE_SITE_KEY: TURNSTILE_SITE_KEY
      GESTTALT_TURNSTILE_SECRET_KEY: TURNSTILE_SECRET_KEY
  postgres:
    itemKey: gesttalt
    passwordField: POSTGRES_PASSWORD
  imagePullSecret:
    enabled: true
    itemKey: kubernetes
