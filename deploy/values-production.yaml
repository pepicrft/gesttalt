fullnameOverride: gesttalt

env:
  GESTTALT_MEDIA_STORAGE: s3
  OTEL_EXPORTER_OTLP_ENDPOINT: http://observability-alloy.observability.svc.cluster.local:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_RESOURCE_ATTRIBUTES: service.namespace=gesttalt,deployment.environment.name=production,k8s.namespace.name=gesttalt
  OTEL_SERVICE_NAME: gesttalt

imagePullSecrets:
  - name: ghcr-pull-secret

service:
  externalTrafficPolicy: Local
  annotations:
    external-dns.alpha.kubernetes.io/hostname: "gesttalt.org,*.gesttalt.org"
    external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
    load-balancer.hetzner.cloud/location: fsn1
    load-balancer.hetzner.cloud/uses-proxyprotocol: "false"

caddy:
  persistence:
    storageClass: hcloud-volumes

media:
  objectStorage:
    enabled: true
    bucketName: pepicrft-gesttalt-media
  persistence:
    storageClass: hcloud-volumes
    size: 50Gi

nodeSelector:
  node.cluster.x-k8s.io/pool: app

postgres:
  storage:
    storageClass: hcloud-volumes
    size: 50Gi
  nodeSelector:
    node.cluster.x-k8s.io/pool: stateful
  tolerations:
    - key: node.cluster.x-k8s.io/pool
      operator: Equal
      value: stateful
      effect: NoSchedule
  backup:
    enabled: true
    endpointURL: https://fsn1.your-objectstorage.com
    bucketName: pepicrft-gesttalt-postgres-backups

externalSecrets:
  enabled: true
  secretStoreRef:
    kind: ClusterSecretStore
    # Legacy store alias for the Pepicrft cluster, not a Salibu-owned cluster.
    name: salibu-production
  appEnv:
    itemKey: gesttalt
    fields:
      GESTTALT_SECRET_KEY_BASE: SECRET_KEY_BASE
      GESTTALT_AGENT_AUTH_PRIVATE_KEY_PEM: AGENT_AUTH_PRIVATE_KEY_PEM
  postgres:
    itemKey: gesttalt
    passwordField: POSTGRES_PASSWORD
  imagePullSecret:
    enabled: true
    itemKey: kubernetes
